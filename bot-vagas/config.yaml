# =====================================================================
# Configuração do bot de vagas de estágio (Nu Dellape)
# Edite este arquivo para ajustar termos, cidades, pesos e limiares.
# =====================================================================

perfil:
  # Previsão de conclusão do curso (AAAA-MM). Usado para sinalizar vagas
  # que exigem formatura antes dessa data.
  formatura: "2028-12"
  # Nota mínima para gerar alerta (0-100). Todas as vagas ficam na planilha;
  # só as acima do limiar viram mensagem.
  limiar_alerta: 55

localizacao:
  # Nu mora em Barão Geraldo (distrito de Campinas) e vai de moto 125cc: só Campinas e região próxima.
  prioridade_1: [Campinas, Paulínia, Sumaré]
  prioridade_2: [Hortolândia, Jaguariúna, Valinhos, Vinhedo]

busca:
  # Janela máxima de publicação (dias). Vagas até 7 dias são marcadas "recente".
  janela_dias: 30
  recente_dias: 7

  # Gupy: para cada cidade das prioridades 1 e 2, busca TODOS os estágios
  # (não só os com "agrícola" no título). A pontuação decide o que importa.
  gupy_termos_por_cidade: ["estágio", "estagiário", "estagiária", "internship", "intern"]

  # Empregos de entrada (além de estágio). false = só estágio.
  incluir_empregos: true
  gupy_termos_emprego_por_cidade: ["assistente", "auxiliar administrativo", "analista júnior",
                                   "analista jr", "trainee"]
  # Emprego (não estágio) só entra se o título tiver uma palavra das áreas abaixo (areas:) ou desta lista.
  # Assim "assistente de churrasqueiro" ou "assistente de loja" nunca aparecem.
  emprego_titulo_tambem_aceita: [administrativo, administrativa, engenharia, engenheiro, engenheira,
                                 pcp, suprimentos, contábil, contabil, fiscal, laboratório, laboratorio,
                                 "segurança do trabalho", analytics, "analista de dados", sistemas,
                                 agronômico, agronomico, ambiental, florestal, geoprocessamento,
                                 "fluxo de caixa", tesouraria, faturamento, "contas a pagar", "contas a receber",
                                 estoque, inventário, inventario, "planejamento de demanda", "plan"]
  # Títulos com estes termos são descartados (cargo acima do nível de entrada ou fora do alvo)
  # Empresas que a Nu não quer (vale também para vagas publicadas por recrutadoras)
  excluir_empresas: [bosch]
  excluir_titulos: [pleno, sênior, senior, " sr ", " sr.", especialista, coordenador, coordenadora,
                    gerente, supervisor, supervisora, líder, lider, diretor, diretora, head,
                    "jovem aprendiz", aprendiz, "pcd exclusiva",
                    # cursos que não são da Nu:
                    odontologia, enfermagem, medicina, "direito ", jurídico, juridico, farmácia, farmacia,
                    psicologia, pedagogia, "educação física", nutrição, nutricao, veterinária, fisioterapia,
                    # fora do perfil (a Nu pediu para nunca mostrar):
                    manobrista, motorista, motoboy, entregador, atendente, recepcionista,
                    vendedor, vendedora, "consultor de vendas", "consultora de vendas",
                    "representante comercial", promotor, promotora, repositor, repositora,
                    "operador de caixa", "operadora de caixa", telemarketing, "call center",
                    "operador de produção", "operadora de produção", "auxiliar de produção",
                    "ajudante geral", "auxiliar de limpeza", porteiro, vigilante, cozinheiro, garçom,
                    "operador de empilhadeira", "técnico de enfermagem", "auxiliar de enfermagem"]

  # Gupy: buscas nacionais para vagas REMOTAS (prioridade 3).
  gupy_termos_remotos:
    - estágio dados
    - estágio BI
    - estágio business intelligence
    - estágio planejamento
    - estágio PMO
    - estágio projetos
    - estágio processos
    - estágio operações
    - estágio melhoria contínua
    - estágio sustentabilidade
    - estágio agronegócio
    - estágio supply chain
    - estágio controladoria
    - data intern
    - project intern
    - operations intern

  # Limite de páginas por consulta (proteção contra loops / excesso de requisições)
  max_paginas: 15
  pausa_entre_requisicoes_seg: 1.0

# ---------------------------------------------------------------------
# Empresas com página de carreira própria (além da Gupy)
# ---------------------------------------------------------------------
# SmartRecruiters: o "id" é o trecho depois de careers.smartrecruiters.com/
smartrecruiters: []
#  - empresa: "Nome"
#    id: "IdDaEmpresa"       # careers.smartrecruiters.com/IdDaEmpresa
#    pais: "br"
#    termos: ["estágio", "estagiário", "intern"]

# Workday: endereço https://HOST/pt-BR/SITE  -> host, tenant (início do host), site.
# Os dois abaixo estão "a confirmar": o bot testa a cada execução; se o endereço
# estiver errado, só aparece um aviso no log (sem alerta no Telegram).
workday:
  - empresa: "3M"
    host: "3m.wd1.myworkdayjobs.com"
    tenant: "3m"
    site: "Search"
    termos: ["estágio", "estagiário", "intern"]
  - empresa: "GE Vernova"
    host: "gevernova.wd5.myworkdayjobs.com"
    tenant: "gevernova"
    site: "Vernova_ExternalSite"
    termos: ["estágio", "estagiário", "intern"]

# Agrobase (estágios e bolsas do agro). Sem confirmação de abertura: entram
# como "NÃO CONFIRMADA" e só se publicadas nos últimos dias_max dias.
agrobase:
  ativo: true
  dias_max: 21

# Agência FAPESP: bolsas de iniciação científica / treinamento técnico na região
# (Unicamp, CNPEM, Embrapa, Ital, IAC, CPqD...).
fapesp:
  ativo: false        # desligado: o foco agora é trabalho (estágio e emprego), não bolsas
  paginas: 3

# ---------------------------------------------------------------------
# Alertas do Glassdoor e do Indeed que chegam no e-mail da Unicamp.
# O script extras/alertas_email.gs (instalado no Gmail) escreve as vagas na aba abaixo;
# o robô só lê a aba e aplica os mesmos filtros de região e área.
alertas_email:
  ativo: true
  aba: "Alertas e-mail"
  dias: 30          # ignora vagas recebidas há mais tempo

